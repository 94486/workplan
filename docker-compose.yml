# ============================================================
# 龙猫工作统计台 - Docker Compose 一键启动
# 用法: docker compose up -d --build   （改过代码/Dockerfile 后务必带 --build，否则复用旧镜像！）
#       docker compose up -d           （仅启动；镜像已存在时【不会】重新构建）
#       docker compose down            （停止并移除容器，命名卷数据保留）
#       docker compose logs -f         （查看日志；导入 500 等报错先看这里的 Traceback）
# 数据：镜像本身不含数据，运行时读写命名卷 work-data 挂载的 /data/works.db（首次自动建空库）
# ============================================================

services:
  work-dashboard:
    build: .
    image: work-dashboard:latest
    container_name: work-dashboard
    # init=true 让 PID 1 正确转发信号（优雅关闭，避免残留）
    init: true
    ports:
      - "8000:8000"
    environment:
      - WORK_DB_PATH=/data/works.db
      - HOST=0.0.0.0
      - PORT=8000
      # 首次启动写入演示数据：设置为 1 后删除该配置即可去掉
      - SEED_DEMO=0
    volumes:
      - work-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 资源限制（可选，按需放开）
    # deploy:
    #   resources:
    #     limits:
    #       memory: 512M

volumes:
  work-data:
