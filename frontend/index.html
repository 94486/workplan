<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人工作管理工作台</title>
  <link rel="stylesheet" href="/static/css/style.css?v=20260918" />
  <link rel="icon" type="image/x-icon" href="/static/favicon.ico" />
  <script>
    // 防闪跳：渲染前按 ?theme= 参数（优先级高）或 localStorage 记忆应用主题
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = (q === "light" || q === "dark") ? q : (localStorage.getItem("wd_theme") || "dark");
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
    })();
  </script>
</head>
<body>
  <!-- 背景科技感装饰层（星星 / 光束 / 透视网格，纯视觉）-->
  <div class="bg-fx" aria-hidden="true">
    <div class="bg-stars"></div>
    <div class="bg-beam"></div>
    <div class="bg-grid-floor"></div>
  </div>

  <!-- 顶部导航 -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-icon">
        <img src="/static/logo.png" alt="龙猫工作统计台" class="brand-logo" width="40" height="40" style="border-radius:11px;object-fit:cover;display:block" />
      </span>
      <div class="brand-text">
        <span class="brand-name">龙猫工作统计台</span>
        <span class="brand-sub" id="heroGreet" title="点击有惊喜">为人民服务</span>
      </div>
    </div>
    <nav class="tabs">
      <button class="tab active" data-tab="kanban"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>日程看板</button>
      <button class="tab" data-tab="stats"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>工时收入</button>
      <button class="tab" data-tab="list"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px" aria-hidden="true"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>全部工作</button>
    </nav>
    <div class="topbar-actions">
      <span class="top-clock" id="topClock">--:--</span>
      <button class="mode-toggle" id="modeSwitch" title="切换日薪 / 月薪模式（两套数据独立）">
        <span class="mt-ico"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px" aria-hidden="true"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg></span><span class="mt-text">日薪模式</span>
      </button>
      <button class="icon-btn" id="btnRefresh" title="刷新数据"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg></button>
      <button class="icon-btn" id="btnTheme" title="切换深浅色主题"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <button class="btn btn-ghost btn-sm" id="btnImport" title="从 JSON / CSV 文件导入数据"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>导入</button>
      <button class="btn btn-ghost btn-sm" id="btnExport" title="导出全部数据为备份文件"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>导出</button>
      <button class="btn btn-ghost btn-sm" id="btnPush" title="数据对接：其他程序通过对接码推送数据，审查后合并">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>对接<span class="push-badge" id="pushBadge" hidden></span>
      </button>
      <button class="btn btn-primary" id="btnNewWork">＋ 录入工作</button>
    </div>
  </header>

  <main class="container">

    <!-- ============ 日程看板 ============ -->
    <section class="view active" id="view-kanban">
      <div class="week-summary" id="weekSummary"></div>
      <div class="board-toolbar">
        <div class="board-nav">
          <div class="view-switch" id="viewSwitch">
            <button class="vs-btn active" data-mode="week">周视图</button>
            <button class="vs-btn" data-mode="month">月视图</button>
          </div>
          <button class="icon-btn" id="boardPrev" title="上一页"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></button>
          <span class="board-range" id="boardRange"></span>
          <button class="icon-btn" id="boardNext" title="下一页"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg></button>
          <button class="btn btn-ghost btn-sm" id="boardToday">回到今天</button>
        </div>
        <div class="legend">
          <span class="legend-item"><i class="dot dot-regular"></i>常规工作</span>
          <span class="legend-item"><i class="dot dot-other"></i>其他工作</span>
          <span class="legend-item"><i class="dot dot-done"></i>已完成</span>
          <span class="legend-item"><i class="dot dot-overdue"></i>已逾期</span>
        </div>
      </div>
      <div class="kanban" id="kanban"></div>
      <div class="board-hint">提示：点击空白日期格快速录入 · 点击卡片查看操作 · 悬浮卡片右上角 ✓ 可一键完成</div>
    </section>

    <!-- ============ 工时收入统计 ============ -->
    <section class="view" id="view-stats">
      <div class="stats-hero" id="statsHero"></div>
      <div class="stats-sub" id="statsSub"></div>
      <div class="stats-grid">
        <div class="panel panel-wide">
          <div class="panel-title" id="weeklyChartTitle">工时 / 收入趋势（近 8 周）<span class="panel-note">柱 · 工时（右轴）｜线 · 收入（左轴）</span></div>
          <div class="chart-wrap"><svg id="chartWeekly" class="chart chart-tall"></svg></div>
        </div>
      </div>
      <div class="period-grid" id="statsPeriods"></div>
      <div class="stats-tables" id="statsTables"></div>
    </section>

    <!-- ============ 全部工作 ============ -->
    <section class="view" id="view-list">
      <div class="list-toolbar">
        <div class="filter-group">
          <label class="search-box">
            <svg class="search-ico" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="search" id="filterSearch" class="input input-search" placeholder="搜索名称 / 备注" autocomplete="off" />
          </label>
          <select id="filterType" class="select">
            <option value="">全部类型</option>
            <option value="regular">常规工作</option>
            <option value="other">其他工作</option>
          </select>
          <select id="filterStatus" class="select">
            <option value="">全部状态</option>
            <option value="pending">待完成</option>
            <option value="done">已完成</option>
          </select>
          <input type="date" id="filterFrom" class="input input-date" />
          <span class="filter-sep">至</span>
          <input type="date" id="filterTo" class="input input-date" />
          <button class="btn btn-ghost btn-sm" id="btnClearFilter">清除筛选</button>
        </div>
        <span class="list-count" id="listCount"></span>
      </div>
      <table class="work-table" id="workTable">
        <thead>
          <tr>
            <th class="sortable" data-key="name">工作名称</th>
            <th>类型</th>
            <th>状态</th>
            <th class="sortable" data-key="planned_date">计划日期</th>
            <th class="sortable" data-key="duration_hours">花费时长</th>
            <th class="sortable" data-key="expected_income">预期收入</th>
            <th class="sortable" data-key="completed_date">完成日期</th>
            <th class="sortable" data-key="actual_income">实际收入</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="workTableBody"></tbody>
        <tfoot id="workTableFoot"></tfoot>
      </table>
    </section>
  </main>

  <!-- 工作编辑弹窗（新建 / 编辑 / 标记完成共用）-->
  <div class="modal-mask" id="workModalMask">
    <div class="modal" id="workModal">
      <div class="modal-head">
        <span class="modal-title" id="modalTitle">录入工作</span>
        <button class="icon-btn" data-close title="关闭"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:0 auto" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div class="toast" id="toast"></div>

  <script src="/static/js/api.js?v=20260918"></script>
  <script src="/static/js/store.js?v=20260918"></script>
  <script src="/static/js/charts.js?v=20260918"></script>
  <script src="/static/js/kanban.js?v=20260918"></script>
  <script src="/static/js/stats.js?v=20260918"></script>
  <script src="/static/js/modal.js?v=20260918"></script>
  <script src="/static/js/app.js?v=20260918"></script>
</body>
</html>
